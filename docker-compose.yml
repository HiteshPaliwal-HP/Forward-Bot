version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: forward-bot:latest
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/forward_bot
      - API_KEY=test-api-key
      - SECRET_KEY=test-secret-key
      - TELEGRAM_SESSION_PATH=/app/data/telegram.session
      - MEDIA_REPLACEMENT_BASE_DIR=/app/data/replacement-images
      - UI_ENABLED=true
    volumes:
      - ./data/telegram:/app/data
      - ./data/replacement-images:/app/data/replacement-images
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data:
